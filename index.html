<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>DANSOS SEKOLAH — Sistem Iuran & Transparansi Dana Sosial</title>
  <meta name="description" content="Aplikasi manajemen iuran dan transparansi keuangan dana sosial sekolah berbasis web, mudah diakses melalui HP dan optimal untuk monitoring di laptop." />
  
  <!-- Metadata OpenGraph / Thumbnail untuk GitHub Pages & Media Sosial -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DANSOS SEKOLAH — Transparansi Dana Sosial" />
  <meta property="og:description" content="Pantau saldo kas, status iuran bulanan, dan penyaluran dana sosial sekolah secara transparan dan real-time." />
  <meta name="theme-color" content="#0f766e" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       ISOLASI FULL-PAGE UNTUK BLOGGER / GOOGLE SITES / GITHUB PAGES
       ========================================================================== */
    :root {
      --primary: #0f766e;
      --primary-hover: #115e59;
      --primary-light: #ccfbf1;
      --primary-soft: #f0fdfa;
      --secondary: #0284c7;
      --secondary-soft: #e0f2fe;
      --success: #059669;
      --success-soft: #d1fae5;
      --warning: #d97706;
      --warning-soft: #fef3c7;
      --danger: #e11d48;
      --danger-soft: #ffe4e6;
      --bg-app: #edf2f7;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #94a3b8;
      --border: #cbd5e1;
      --border-strong: #94a3b8;
      --frame-border: #94a3b8;
      --shadow-sm: 0 2px 6px -1px rgba(15, 23, 42, 0.08), 0 1px 3px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 18px -4px rgba(15, 23, 42, 0.11), 0 3px 6px -2px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 14px 30px -6px rgba(15, 23, 42, 0.16), 0 8px 12px -6px rgba(15, 23, 42, 0.09);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --sidebar-w: 268px;
      --header-h: 68px;
      --bottom-nav-h: 72px;
    }

    /* Sembunyikan elemen bawaan template Blogger tanpa merusak container utama */
    body.blogger-embed .header-outer,
    body.blogger-embed .tabs-outer,
    body.blogger-embed .sidebar-container,
    body.blogger-embed .footer-outer,
    body.blogger-embed .blog-pager,
    body.blogger-embed #navbar-iframe {
      display: none !important;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* ==========================================================================
       APP SHELL (MOBILE-FIRST & DESKTOP SIDEBAR)
       ========================================================================== */
    #app-dansos-root {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Sidebar Desktop */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-card);
      border-right: 1.5px solid var(--border);
      box-shadow: 2px 0 10px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 40;
      transition: transform 0.25s ease;
    }

    .sidebar-brand {
      padding: 22px 20px;
      border-bottom: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(15, 118, 110, 0.25);
    }

    .brand-info h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-info p {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 175px;
    }

    .sidebar-nav {
      padding: 16px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .nav-section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-light);
      padding: 10px 12px 6px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 14px;
      border: none;
      background: transparent;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
    }

    .nav-btn:hover {
      background: var(--bg-app);
      color: var(--text-main);
    }

    .nav-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .nav-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--warning-soft);
      color: var(--warning);
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1.5px solid var(--border);
      background: #f8fafc;
    }

    .mode-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: #ffffff;
      border: 1.5px solid var(--border);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .status-dot.preview { background: var(--warning); }
    .status-dot.live { background: var(--success); }

    /* Main Content Wrapper */
    .main-wrapper {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top Header */
    .topbar {
      height: var(--header-h);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1.5px solid var(--border);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
      gap: 12px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-logo {
      display: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .page-heading h2 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-heading p {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
    }

    .role-chip.guest {
      background: #f1f5f9;
      color: #475569;
    }

    .role-chip.admin {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-light);
    }

    /* Main Container */
    .content-area {
      padding: 24px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    /* Bottom Navigation (Mobile Only — Floating Dock) */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 12px;
      right: 12px;
      height: var(--bottom-nav-h);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      z-index: 45;
      padding: 6px 8px;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
    }

    .bnav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 2px;
      border-radius: 14px;
      position: relative;
      transition: transform 0.16s ease, color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .bnav-item:active {
      transform: scale(0.92);
    }

    .bnav-icon-wrap {
      width: 44px;
      height: 32px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .bnav-item svg {
      width: 20px;
      height: 20px;
      transition: transform 0.25s ease;
    }

    .bnav-item.active .bnav-icon-wrap {
      background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);
      color: #ffffff;
      transform: translateY(-4px) scale(1.06);
      box-shadow: 0 6px 14px rgba(15, 118, 110, 0.36);
    }

    .bnav-item.active {
      color: var(--primary);
      font-weight: 800;
    }

    .bnav-item.active::after {
      content: "";
      width: 14px;
      height: 3px;
      border-radius: 99px;
      background: var(--primary);
      margin-top: 1px;
      animation: navDotIn 0.24s ease-out;
    }

    @keyframes navDotIn {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    /* Menu Tengah (Transaksi) Lebih Menonjol */
    .bnav-item.bnav-center .bnav-icon-wrap {
      width: 48px;
      height: 36px;
      border-radius: 14px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1.5px solid var(--primary-light);
    }

    .bnav-item.bnav-center.active .bnav-icon-wrap {
      background: linear-gradient(135deg, #0f766e 0%, #0284c7 100%);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-6px) scale(1.1);
      box-shadow: 0 8px 18px rgba(15, 118, 110, 0.4);
    }

    .bnav-badge {
      position: absolute;
      top: -3px;
      right: 2px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 99px;
      background: var(--danger);
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #ffffff;
      box-shadow: 0 2px 5px rgba(225, 29, 72, 0.4);
    }

    /* ==========================================================================
       COMPONENTS: BUTTONS, CARDS, FORMS, BADGES, TABLES
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.16s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-sm {
      padding: 6px 11px;
      font-size: 12.5px;
    }

    .btn-xs {
      padding: 4px 8px;
      font-size: 11.5px;
      border-radius: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 3px 10px rgba(15, 118, 110, 0.25);
    }

    .btn-success {
      background: var(--success);
      color: #ffffff;
    }

    .btn-success:hover:not(:disabled) {
      background: #047857;
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-danger:hover:not(:disabled) {
      background: #be123c;
    }

    .btn-outline {
      background: #ffffff;
      color: var(--text-main);
      border-color: var(--border-strong);
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--bg-app);
      border-color: #94a3b8;
    }

    .btn-soft-primary {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary-light);
    }

    .btn-soft-primary:hover:not(:disabled) {
      background: var(--primary-light);
    }

    .btn-soft-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-soft-danger:hover:not(:disabled) {
      background: #fecdd3;
    }

    .btn-wa {
      background: #16a34a;
      color: #ffffff;
    }

    .btn-wa:hover:not(:disabled) {
      background: #15803d;
    }

    .card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      overflow: hidden;
    }

    .card-header {
      padding: 18px 20px;
      border-bottom: 1.5px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card-body {
      padding: 20px;
    }

    /* Hero Balance Banner */
    .hero-banner {
      background: linear-gradient(135deg, #0f766e 0%, #115e59 55%, #134e4a 100%);
      border: 1.5px solid #0d9488;
      border-radius: var(--radius-xl);
      padding: 24px;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 14px 28px -8px rgba(15, 118, 110, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .hero-banner::after {
      content: "";
      position: absolute;
      right: -40px;
      top: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }

    .hero-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .hero-label {
      font-size: 13px;
      font-weight: 600;
      color: #99f6e4;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hero-amount {
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 6px 0 8px;
    }

    .hero-meta {
      font-size: 12.5px;
      color: #ccfbf1;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-hero-light {
      background: #ffffff;
      color: var(--primary);
      font-weight: 700;
    }

    .btn-hero-light:hover {
      background: #f0fdfa;
    }

    .btn-hero-glass {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .btn-hero-glass:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* KPI Stat Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-top: 3.5px solid var(--primary);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-strong);
    }

    .kpi-card:nth-child(1) { border-top-color: var(--success); }
    .kpi-card:nth-child(2) { border-top-color: var(--danger); }
    .kpi-card:nth-child(3) { border-top-color: var(--primary); }
    .kpi-card:nth-child(4) { border-top-color: var(--secondary); }

    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .kpi-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kpi-value {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .kpi-foot {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Dashboard 2-Column Section */
    .dash-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 20px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-warning { background: var(--warning-soft); color: var(--warning); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-info { background: var(--secondary-soft); color: var(--secondary); }
    .badge-neutral { background: #f1f5f9; color: #475569; }

    /* Filters Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .input-control, .select-control, .textarea-control {
      padding: 9px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      background: #ffffff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-control:focus, .select-control:focus, .textarea-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 210px;
    }

    .search-box input {
      width: 100%;
      padding-left: 36px;
    }

    .search-box svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-light);
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    th {
      background: #f1f5f9;
      color: var(--text-main);
      font-weight: 800;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid #dbe3ec;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    /* Matrix Cells */
    .matrix-cell {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.12s;
    }

    .matrix-cell:hover {
      transform: scale(1.1);
    }

    .matrix-cell.paid {
      background: var(--success-soft);
      color: var(--success);
      border-color: #a7f3d0;
    }

    .matrix-cell.unpaid {
      background: #f8fafc;
      color: #94a3b8;
      border-color: var(--border);
    }

    .matrix-cell.overdue {
      background: var(--warning-soft);
      color: var(--warning);
      border-color: #fde68a;
    }

    /* Mobile Card Lists */
    .mobile-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .item-card {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .item-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }

    .trx-card-masuk { border-left: 4px solid var(--success); }
    .trx-card-keluar { border-left: 4px solid var(--danger); }

    .mini-months {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-top: 4px;
    }

    .mini-m-tag {
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 2px;
      border-radius: 5px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 10px 16px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modalPop 0.18s ease-out;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 17px;
      font-weight: 800;
    }

    .modal-close {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .modal-body {
      padding: 20px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-footer {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .month-picker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .month-check-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 6px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .month-check-item.selected {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .month-check-item.already-paid {
      background: #f1f5f9;
      color: #94a3b8;
      border-color: var(--border);
      cursor: not-allowed;
    }

    /* Digital Receipt Styling */
    .receipt-paper {
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 20px;
      background: #fcfdfe;
      position: relative;
    }

    .receipt-stamp {
      position: absolute;
      right: 18px;
      top: 18px;
      border: 2px solid var(--success);
      color: var(--success);
      font-weight: 800;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 6px;
      transform: rotate(-6deg);
      letter-spacing: 0.08em;
    }

    /* Toast & Loading */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
    }

    .toast {
      padding: 13px 16px;
      border-radius: var(--radius-md);
      background: #0f172a;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.2s ease-out;
    }

    .toast.success { background: #065f46; border-left: 4px solid #34d399; }
    .toast.error { background: #9f1239; border-left: 4px solid #fb7185; }
    .toast.info { background: #1e293b; border-left: 4px solid #38bdf8; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(2px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 150;
      gap: 12px;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* SVG Bar Chart (Motion Graphic Animated) */
    .chart-live-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 14px;
      margin-bottom: 10px;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 12.5px;
    }

    .chart-box {
      width: 100%;
      overflow-x: auto;
      padding: 10px 6px 4px;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .chart-col-group {
      cursor: pointer;
    }

    .chart-hover-bg {
      fill: transparent;
      transition: fill 0.18s ease;
    }

    .chart-col-group:hover .chart-hover-bg,
    .chart-col-group.active-col .chart-hover-bg {
      fill: rgba(15, 118, 110, 0.07);
    }

    .chart-bar-anim {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: chartBarRise 0.72s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: filter 0.18s ease, opacity 0.18s ease;
    }

    .chart-col-group:hover .chart-bar-anim,
    .chart-col-group.active-col .chart-bar-anim {
      filter: brightness(1.08) drop-shadow(0 4px 8px rgba(15, 23, 42, 0.18));
    }

    @keyframes chartBarRise {
      0% {
        transform: scaleY(0);
        opacity: 0.15;
      }
      75% {
        transform: scaleY(1.04);
        opacity: 1;
      }
      100% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    .chart-trend-area {
      opacity: 0;
      animation: chartFadeIn 0.8s ease 0.45s forwards;
    }

    .chart-trend-line {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: chartLineDraw 1.25s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
    }

    @keyframes chartLineDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes chartFadeIn {
      to {
        opacity: 1;
      }
    }

    .chart-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: chartDotPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes chartDotPop {
      from {
        transform: scale(0);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .chart-pulse-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: chartPulse 2s ease-out infinite;
    }

    @keyframes chartPulse {
      0% {
        transform: scale(0.9);
        opacity: 0.75;
      }
      100% {
        transform: scale(2.3);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .chart-bar-anim, .chart-trend-line, .chart-trend-area, .chart-dot, .chart-pulse-ring {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        opacity: 1 !important;
      }
    }

    /* Responsive Breakpoints */
    @media (max-width: 1023px) {
      .sidebar {
        display: none;
      }
      .main-wrapper {
        margin-left: 0;
        padding-bottom: calc(var(--bottom-nav-h) + 26px);
      }
      .mobile-logo {
        display: flex;
      }
      .bottom-nav {
        display: flex;
      }
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .dash-grid {
        grid-template-columns: 1fr;
      }
      .topbar {
        padding: 0 16px;
      }
      .content-area {
        padding: 16px;
      }
    }

    @media (max-width: 540px) {
      .kpi-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .kpi-card {
        padding: 14px;
      }
      .kpi-value {
        font-size: 16.5px;
      }
      .form-row {
        grid-template-columns: 1fr;
      }
      .hero-banner {
        padding: 18px;
      }
      .hide-xs {
        display: none !important;
      }
    }

    /* Print Styles (Laporan Resmi & Kwitansi) */
    @media print {
      .sidebar, .topbar, .bottom-nav, .no-print, .toast-container, .loading-overlay {
        display: none !important;
      }
      .main-wrapper {
        margin-left: 0 !important;
        padding: 0 !important;
      }
      .content-area {
        padding: 0 !important;
        max-width: 100% !important;
      }
      body {
        background: #ffffff !important;
      }
      .card {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
      }
      .print-only {
        display: block !important;
      }
    }

    .print-only {
      display: none;
    }
  </style>
</head>

    function isAdmin() {

    function formatRupiah(num) {
      const val = Number(num) || 0;
      return "Rp " + val.toLocaleString("id-ID");
    }

    function formatDateID(dateStr) {
      if (!dateStr) return "-";
      const parts = String(dateStr).split("-");
      if (parts.length !== 3) return dateStr;
      const mIdx = parseInt(parts[1], 10) - 1;
      const mName = MONTHS_ID[mIdx] ? MONTHS_ID[mIdx].short : parts[1];
      return `${parts[2]} ${mName} ${parts[0]}`;
    }

    function formatPeriodeID(ym) {
      if (!ym || !ym.includes("-")) return ym || "-";
      const [y, m] = ym.split("-");
      const mObj = MONTHS_ID.find(x => x.num === m);
      return mObj ? `${mObj.name} ${y}` : ym;
    }

    function getCurrentYM() {
      // Gunakan bulan berjalan (November 2026 pada konteks aktif atau sistem)
      const now = new Date();
      const y = state.selectedYear || String(now.getFullYear());
      const m = String(now.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}`;

    function getMemberName(memberId) {
      if (!memberId) return "-";
      const m = state.members.find(x => x.member_id === memberId);
      return m ? m.nama : memberId;

    function maskPhone(phone) {
      if (!phone) return "-";
      if (isAdmin()) return phone;
      const s = String(phone);
      if (s.length <= 6) return "****";
      return s.slice(0, 5) + "****" + s.slice(-3);
    }

    function terbilang(angka) {
      const n = Math.floor(Math.abs(Number(angka) || 0));
      if (n === 0) return "Nol Rupiah";
      const satuan = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
      function konversi(x) {
        if (x < 12) return satuan[x];
        if (x < 20) return konversi(x - 10) + " Belas";
        if (x < 100) return konversi(Math.floor(x / 10)) + " Puluh " + konversi(x % 10);
        if (x < 200) return "Seratus " + konversi(x - 100);
        if (x < 1000) return konversi(Math.floor(x / 100)) + " Ratus " + konversi(x % 100);
        if (x < 2000) return "Seribu " + konversi(x - 1000);
        if (x < 1000000) return konversi(Math.floor(x / 1000)) + " Ribu " + konversi(x % 1000);
        if (x < 1000000000) return konversi(Math.floor(x / 1000000)) + " Juta " + konversi(x % 1000000);
        return konversi(Math.floor(x / 1000000000)) + " Miliar " + konversi(x % 1000000000);
      }
      return konversi(n).replace(/\s+/g, " ").trim() + " Rupiah";
    }

    function escapeHTML(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    // ==========================================
    // KOMUNIKASI API (PREVIEW & PRODUCTION GAS)
    // ==========================================
    async function apiRequest(action, payload = {}, method = "POST") {
      if (IS_PREVIEW) {
        await new Promise(r => setTimeout(r, 240));
        return handlePreviewApi(action, payload);
      }

      if (!GAS_URL || GAS_URL === "URL_DEPLOY_GAS_ANDA") {
        throw new Error("GAS_URL belum dikonfigurasi. Silakan isi URL Web App Google Apps Script Anda.");
      }

      const token = state.session ? state.session.token : "";
      let response;
      if (method === "GET") {
        const url = new URL(GAS_URL);
        url.searchParams.set("action", action);
        if (token) url.searchParams.set("token", token);
        Object.keys(payload).forEach(k => url.searchParams.set(k, payload[k]));
        response = await fetch(url.toString(), { method: "GET" });
      } else {
        response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action, token, ...payload })
        });
      }

      if (!response.ok) {
        throw new Error(`HTTP Error ${response.status}`);
      }
      const resJson = await response.json();
      if (resJson.status === "error") {
        throw new Error(resJson.message || "Terjadi kesalahan pada server.");
      }
      return resJson;
    }

    // Simulasi Backend Lengkap untuk Mode Preview
    function handlePreviewApi(action, payload) {
      switch (action) {
        case "getInitialData":
          return {
            status: "success",
            data: {
              settings: state.settings,
              members: state.members,
              transactions: state.transactions,
              users: isAdmin() ? state.users : []
            }
          };

        case "login": {
          const { username, password } = payload;
          if ((username === "admin" && password === "123456") || (username === "peserta" && password === "123456")) {
            const isAdm = username === "admin";
            return {
              status: "success",
              message: "Login berhasil (Mode Preview)",
              data: {
                token: "PREVIEW-TOKEN-" + Date.now(),
                username,
                nama_lengkap: isAdm ? "Hj. Siti Aminah (Bendahara)" : "Anggota Sekolah",
                role: isAdm ? "Admin" : "Peserta"
              }
            };
          }
          return { status: "error", message: "Username atau password salah. (Preview Admin: admin / 123456)" };
        }

        case "logout":
          return { status: "success", message: "Berhasil keluar." };

        case "saveMember": {
          if (!isAdmin()) return { status: "error", message: "Akses ditolak. Hanya Admin yang dapat mengubah data." };
          if (payload.member_id) {
            const idx = state.members.findIndex(m => m.member_id === payload.member_id);
            if (idx === -1) return { status: "error", message: "Anggota tidak ditemukan." };
            state.members[idx] = { ...state.members[idx], ...payload };
            return { status: "success", message: "Data anggota berhasil diperbarui." };
          } else {
            const newId = "MBR-" + String(Date.now()).slice(-5);
            state.members.push({ ...payload, member_id: newId });
            return { status: "success", message: "Anggota baru berhasil ditambahkan." };
          }
        }

        case "deleteMember": {
          if (!isAdmin()) return { status: "error", message: "Akses ditolak." };
          state.members = state.members.filter(m => m.member_id !== payload.member_id);
          return { status: "success", message: "Data anggota berhasil dihapus." };
        }

        case "saveTransaction": {
          if (!isAdmin()) return { status: "error", message: "Akses ditolak. Hanya Admin yang dapat mencatat transaksi." };
          if (payload.trx_id) {
            const idx = state.transactions.findIndex(t => t.trx_id === payload.trx_id);
            if (idx === -1) return { status: "error", message: "Transaksi tidak ditemukan." };
            state.transactions[idx] = { ...state.transactions[idx], ...payload };
            return { status: "success", message: "Transaksi berhasil diperbarui." };
          } else if (Array.isArray(payload.periode_list) && payload.periode_list.length > 0) {
            payload.periode_list.forEach((ym, i) => {
              state.transactions.unshift({
                trx_id: `TRX-${ym.replace("-", "")}-${String(Date.now()).slice(-4)}${i + 1}`,
                tanggal: payload.tanggal,
                jenis: "Masuk",
                kategori: payload.kategori || "Iuran Rutin",
                member_id: payload.member_id,
                periode_bulan: ym,
                nominal: Number(payload.nominal_per_bulan),
                keterangan: payload.keterangan || `Iuran Dana Sosial Periode ${formatPeriodeID(ym)}`,
                bukti_url: payload.bukti_url || "",
                created_by: state.session.username
              });
            });
            return { status: "success", message: `${payload.periode_list.length} bulan pembayaran iuran berhasil dicatat.` };
          } else {
            state.transactions.unshift({
              trx_id: `TRX-${String(payload.tanggal).replace(/-/g, "")}-${String(Date.now()).slice(-4)}`,
              tanggal: payload.tanggal,
              jenis: payload.jenis,
              kategori: payload.kategori,
              member_id: payload.member_id || "",
              periode_bulan: payload.periode_bulan || String(payload.tanggal).slice(0, 7),
              nominal: Number(payload.nominal),
              keterangan: payload.keterangan,
              bukti_url: payload.bukti_url || "",
              created_by: state.session.username
            });
            return { status: "success", message: "Transaksi berhasil disimpan." };
          }
        }

        case "deleteTransaction": {
          if (!isAdmin()) return { status: "error", message: "Akses ditolak." };
          state.transactions = state.transactions.filter(t => t.trx_id !== payload.trx_id);
          return { status: "success", message: "Transaksi berhasil dihapus." };
        }

        case "saveSettings": {
          if (!isAdmin()) return { status: "error", message: "Akses ditolak." };
          state.settings = { ...state.settings, ...payload.settings };
          state.selectedYear = state.settings.tahun_aktif || state.selectedYear;
          return { status: "success", message: "Pengaturan aplikasi berhasil disimpan." };
        }

        case "saveUser": {
          if (!isAdmin()) return { status: "error", message: "Akses ditolak." };
          if (payload.user_id) {
            const idx = state.users.findIndex(u => u.user_id === payload.user_id);
            if (idx > -1) state.users[idx] = { ...state.users[idx], ...payload };
            return { status: "success", message: "Akun admin diperbarui." };
          } else {
            state.users.push({
              user_id: "USR-" + String(Date.now()).slice(-4),
              username: payload.username,
              nama_lengkap: payload.nama_lengkap,
              role: "Admin",
              status: payload.status || "Aktif"
            });
            return { status: "success", message: "Akun admin baru ditambahkan." };
          }
        }

        case "deleteUser": {
          if (!isAdmin()) return { status: "error", message: "Akses ditolak." };
          if (state.users.length <= 1) return { status: "error", message: "Minimal harus ada 1 akun admin aktif." };
          state.users = state.users.filter(u => u.user_id !== payload.user_id);
          return { status: "success", message: "Akun admin dihapus." };
        }

        default:
          return { status: "error", message: "Endpoint tidak dikenal." };
      }
    }

    // ==========================================
    // SINKRONISASI & AUTHENTICATION
    // ==========================================
    async function refreshData() {
      setLoading(true, "Memuat data kas & iuran...");
      try {
        const res = await apiRequest("getInitialData", {}, "GET");
        if (res.data) {
          if (res.data.settings) state.settings = { ...state.settings, ...res.data.settings };
          if (Array.isArray(res.data.members)) state.members = res.data.members;
          if (Array.isArray(res.data.transactions)) state.transactions = res.data.transactions;
          if (Array.isArray(res.data.users)) state.users = res.data.users;
          if (state.settings.tahun_aktif && !state.selectedYear) {
            state.selectedYear = String(state.settings.tahun_aktif);
          }
        }
        updateShellUI();
        renderCurrentPage();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

    function handleAuthButtonClick() {
      if (state.session) {
        openModal(
          "Konfirmasi Keluar",
          `<p style="font-size: 14px; color: var(--text-muted);">Anda sedang masuk sebagai <strong>${escapeHTML(state.session.nama_lengkap)}</strong> (${escapeHTML(state.session.role)}). Keluar dari mode kelola?</p>`,
          `<button class="btn btn-outline" onclick="closeModal()">Batal</button>
           <button class="btn btn-danger" onclick="performLogout()">Ya, Keluar</button>`
        );
      } else {
        openLoginModal();
      }
    }

    function openLoginModal() {
      const previewHint = IS_PREVIEW
        ? `<div style="background: var(--primary-soft); border: 1px solid var(--primary-light); padding: 10px 12px; border-radius: 8px; font-size: 12.5px; color: var(--primary);">
             <strong>Info Mode Preview:</strong> Gunakan username <code class="mono">admin</code> dan password <code class="mono">123456</code> untuk menguji fitur CRUD Admin.
           </div>`
        : "";

      openModal(
        "Login Pengelola / Admin",
        `${previewHint}
         <form id="login-form" onsubmit="submitLogin(event)" style="display:flex; flex-direction:column; gap:12px;">
           <div class="form-group">
             <label>Username</label>
             <input type="text" id="login-username" class="input-control" placeholder="Masukkan username admin" required autocomplete="username" />
           </div>
           <div class="form-group">
             <label>Password</label>
             <input type="password" id="login-password" class="input-control" placeholder="Masukkan password" required autocomplete="current-password" />
           </div>
           <button type="submit" class="btn btn-primary" style="width:100%; margin-top:4px;">Masuk Sekarang</button>
         </form>`
      );
      setTimeout(() => document.getElementById("login-username")?.focus(), 100);
    }

    async function submitLogin(e) {
      e.preventDefault();
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;
      if (!username || !password) return;

      setLoading(true, "Memverifikasi kredensial...");
      try {
        const res = await apiRequest("login", { username, password }, "POST");
        state.session = res.data;
        localStorage.setItem("dansos_session", JSON.stringify(res.data));
        closeModal();
        showToast(`Selamat datang, ${res.data.nama_lengkap}!`, "success");
        await refreshData();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

    async function performLogout() {
      setLoading(true, "Mengakhiri sesi...");
      try {
        await apiRequest("logout", {}, "POST");
      } catch (_) {}
      state.session = null;
      localStorage.removeItem("dansos_session");
      closeModal();
      showToast("Anda telah keluar dari mode Admin.", "info");
      await refreshData();
    }

    function updateShellUI() {
      document.getElementById("sidebar-school-name").textContent = state.settings.nama_sekolah || "Sekolah";
      document.getElementById("sidebar-year-label").textContent = state.selectedYear;

      const connLabel = document.getElementById("connection-status-label");
      connLabel.innerHTML = IS_PREVIEW
        ? `<span class="status-dot preview"></span>Mode Preview`
        : `<span class="status-dot live"></span>Terhubung GAS`;

      const roleChip = document.getElementById("topbar-role-chip");
      const topAuthBtn = document.getElementById("topbar-auth-btn");
      const sideAuthBtn = document.getElementById("sidebar-auth-btn");

      if (isAdmin()) {
        roleChip.className = "role-chip admin";
        roleChip.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span>Admin</span>`;
        topAuthBtn.textContent = "Keluar";
        topAuthBtn.className = "btn btn-soft-danger btn-sm";
        sideAuthBtn.textContent = `Keluar (${state.session.username})`;
        sideAuthBtn.className = "btn btn-soft-danger";
      } else {
        roleChip.className = "role-chip guest";
        roleChip.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="hide-xs">Mode Pantau</span>`;
        topAuthBtn.textContent = "Login Admin";
        topAuthBtn.className = "btn btn-primary btn-sm";
        sideAuthBtn.textContent = "Login Admin";
        sideAuthBtn.className = "btn btn-primary";
      }

      // Hitung anggota belum bayar bulan berjalan
      const curYM = getCurrentYM();
      const activeMembers = state.members.filter(m => m.status === "Aktif");
      const unpaidCount = activeMembers.filter(m => !hasPaidMonth(m.member_id, curYM)).length;

      }

      if (bnavBadgeEl) {

        bnavBadgeEl.style.display = unpaidCount > 0 ? "inline-flex" : "none";

    function navigateTo(page) {
      state.currentPage = page;
      document.querySelectorAll(".nav-btn, .bnav-item").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
      });
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderCurrentPage() {
      const titles = {
        dashboard: ["DANA SOSIAL TELADAN", `${state.settings.nama_sekolah} • Tahun Buku ${state.selectedYear}`],
        members: ["Manajemen Anggota & Iuran", "Monitoring status kepesertaan & matriks pembayaran bulanan"],
        transactions: ["Transaksi & Mutasi Kas", "Pencatatan pemasukan iuran dan penyaluran dana sosial"],
        reports: ["Laporan & Transparansi", "Rekapitulasi keuangan resmi siap cetak & unduh"],

    // ==========================================
    // KALKULASI DATA KEUANGAN
    // ==========================================
    function hasPaidMonth(memberId, ym) {
      return state.transactions.some(
        t => t.jenis === "Masuk" && t.kategori === "Iuran Rutin" && t.member_id === memberId && t.periode_bulan === ym
      );
    }

    function getTransactionForMonth(memberId, ym) {
      return state.transactions.find(
        t => t.jenis === "Masuk" && t.kategori === "Iuran Rutin" && t.member_id === memberId && t.periode_bulan === ym
      );
    }

    function computeFinancialStats() {
      const totalInAll = state.transactions
        .filter(t => t.jenis === "Masuk")
        .reduce((acc, t) => acc + (Number(t.nominal) || 0), 0);

      const totalOutAll = state.transactions
        .filter(t => t.jenis === "Keluar")
        .reduce((acc, t) => acc + (Number(t.nominal) || 0), 0);

      const saldoKas = totalInAll - totalOutAll;

      const curYM = getCurrentYM();
      const inThisMonth = state.transactions
        .filter(t => t.jenis === "Masuk" && String(t.tanggal).startsWith(curYM))
        .reduce((acc, t) => acc + (Number(t.nominal) || 0), 0);

      const outThisMonth = state.transactions
        .filter(t => t.jenis === "Keluar" && String(t.tanggal).startsWith(curYM))
        .reduce((acc, t) => acc + (Number(t.nominal) || 0), 0);

      const activeMembers = state.members.filter(m => m.status === "Aktif");
      const paidMembersCount = activeMembers.filter(m => hasPaidMonth(m.member_id, curYM)).length;
      const compliancePct = activeMembers.length > 0 ? Math.round((paidMembersCount / activeMembers.length) * 100) : 0;

      // Data bulanan tahun terpilih untuk grafik
      const monthlySeries = MONTHS_ID.map(m => {
        const ym = `${state.selectedYear}-${m.num}`;
        const masuk = state.transactions
          .filter(t => t.jenis === "Masuk" && String(t.tanggal).startsWith(ym))
          .reduce((a, b) => a + (Number(b.nominal) || 0), 0);
        const keluar = state.transactions
          .filter(t => t.jenis === "Keluar" && String(t.tanggal).startsWith(ym))
          .reduce((a, b) => a + (Number(b.nominal) || 0), 0);
        return { label: m.short, ym, masuk, keluar };
      });

      return {
        totalInAll,
        totalOutAll,
        saldoKas,
        curYM,
        inThisMonth,
        outThisMonth,
        activeCount: activeMembers.length,
        paidMembersCount,
        compliancePct,
        monthlySeries
      };
    }

    // ==========================================
    // 1. MENU UTAMA (DASHBOARD)
    // ==========================================
    function renderDashboardView() {
      const stats = computeFinancialStats();
      const recentTrxs = [...state.transactions]
        .sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)))
        .slice(0, 6);

      const heroQuickBtns = isAdmin()
        ? `<button class="btn btn-hero-light" onclick="openIuranModal()">+ Catat Iuran</button>
           <button class="btn btn-hero-glass" onclick="openTransactionModal('Keluar')">+ Catat Penyaluran</button>`
        : `<button class="btn btn-hero-light" onclick="navigateTo('members')">Cek Status Iuran</button>
           <button class="btn btn-hero-glass" onclick="navigateTo('reports')">Laporan Resmi</button>`;

      // Bangun SVG Motion Graphic Chart Responsif & Interaktif
      const maxVal = Math.max(...stats.monthlySeries.map(d => Math.max(d.masuk, d.keluar)), 100000);
      const chartH = 224;
      const topPad = 20;
      const bottomPad = 28;
      const leftPad = 48;
      const plotH = chartH - topPad - bottomPad;
      const yBase = chartH - bottomPad;
      const barGroupW = 54;
      const svgW = leftPad + MONTHS_ID.length * barGroupW + 14;

      const formatCompactRp = (v) => {
        if (v <= 0) return "0";
        if (v >= 1000000) return (v / 1000000).toFixed(1).replace(/\.0$/, "") + "jt";
        if (v >= 1000) return Math.round(v / 1000) + "rb";
        return String(v);
      };

      const gridLinesSVG = [0, 0.25, 0.5, 0.75, 1].map(ratio => {
        const y = Math.round(yBase - ratio * plotH);
        const val = Math.round(maxVal * ratio);
        return `
          <g>
            <line x1="${leftPad}" y1="${y}" x2="${svgW - 10}" y2="${y}" stroke="${ratio === 0 ? '#94a3b8' : '#e2e8f0'}" stroke-width="${ratio === 0 ? '1.4' : '1'}" ${ratio > 0 ? 'stroke-dasharray="4 4"' : ''} />
            <text x="${leftPad - 8}" y="${y + 4}" text-anchor="end" font-size="10" font-weight="600" fill="#64748b">${formatCompactRp(val)}</text>
          </g>
        `;
      }).join("");

      const curMonthIdx = Math.max(0, Math.min(11, parseInt(stats.curYM.split("-")[1], 10) - 1));
      window._chartSeriesCache = stats.monthlySeries;

      const trendPoints = [];
      const barsSVG = stats.monthlySeries.map((d, idx) => {
        const xBase = leftPad + 10 + idx * barGroupW;
        const hIn = d.masuk > 0 ? Math.max(Math.round((d.masuk / maxVal) * plotH), 5) : 2;
        const hOut = d.keluar > 0 ? Math.max(Math.round((d.keluar / maxVal) * plotH), 5) : 2;
        const yIn = yBase - hIn;
        const yOut = yBase - hOut;
        const xCenter = xBase + 17;
        trendPoints.push({ x: xCenter, y: yIn, idx, d });

        const delayIn = idx * 55;
        const delayOut = idx * 55 + 90;
        const isCurrent = idx === curMonthIdx;

        return `
          <g class="chart-col-group ${isCurrent ? 'active-col' : ''}" data-idx="${idx}" onmouseenter="highlightChartMonth(${idx})" onclick="highlightChartMonth(${idx})">
            <title>${d.label} ${state.selectedYear} — Masuk: ${formatRupiah(d.masuk)} | Keluar: ${formatRupiah(d.keluar)}</title>
            <rect class="chart-hover-bg" x="${xBase - 6}" y="${topPad - 6}" width="${barGroupW - 6}" height="${plotH + 10}" rx="8" />
            <rect class="chart-bar-anim" style="animation-delay:${delayIn}ms;" x="${xBase}" y="${yIn}" width="16" height="${hIn}" rx="4" fill="url(#gradMasuk)" />
            <rect class="chart-bar-anim" style="animation-delay:${delayOut}ms;" x="${xBase + 19}" y="${yOut}" width="16" height="${hOut}" rx="4" fill="url(#gradKeluar)" />
            <text x="${xCenter}" y="${chartH - 8}" text-anchor="middle" font-size="11" font-weight="${isCurrent ? '800' : '600'}" fill="${isCurrent ? '#0f766e' : '#64748b'}">${d.label}</text>
          </g>
        `;
      }).join("");

      // Kurva Tren Halus (Cubic Bezier Motion Path)
      let trendPathD = "";
      let trendAreaD = "";
      if (trendPoints.length > 0) {
        trendPathD = `M ${trendPoints[0].x} ${trendPoints[0].y}`;
        for (let i = 0; i < trendPoints.length - 1; i++) {
          const p0 = trendPoints[i];
          const p1 = trendPoints[i + 1];
          const midX = (p0.x + p1.x) / 2;
          trendPathD += ` C ${midX} ${p0.y}, ${midX} ${p1.y}, ${p1.x} ${p1.y}`;
        }
        const firstP = trendPoints[0];
        const lastP = trendPoints[trendPoints.length - 1];
        trendAreaD = `${trendPathD} L ${lastP.x} ${yBase} L ${firstP.x} ${yBase} Z`;
      }

      const trendDotsSVG = trendPoints.map((pt, idx) => {
        const isCurrent = idx === curMonthIdx;
        const dotDelay = 450 + idx * 55;
        return `
          <g style="pointer-events:none;">
            ${isCurrent ? `<circle class="chart-pulse-ring" cx="${pt.x}" cy="${pt.y}" r="7" fill="none" stroke="#0f766e" stroke-width="2" />` : ""}
            <circle class="chart-dot" style="animation-delay:${dotDelay}ms;" cx="${pt.x}" cy="${pt.y}" r="${isCurrent ? '4.5' : '3'}" fill="#ffffff" stroke="#0f766e" stroke-width="2.2" />
          </g>
        `;
      }).join("");

      const activePoint = stats.monthlySeries[curMonthIdx] || { label: "-", ym: stats.curYM, masuk: 0, keluar: 0 };
      const activeNet = activePoint.masuk - activePoint.keluar;

      const recentHTML = recentTrxs.length === 0
        ? `<p style="color:var(--text-muted); font-size:13.5px; text-align:center; padding:24px 0;">Belum ada transaksi tercatat.</p>`
        : recentTrxs.map(t => {
            const isIn = t.jenis === "Masuk";
            const actor = t.member_id ? getMemberName(t.member_id) : t.kategori;
            return `
              <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);">
                <div style="min-width:0; flex:1;">
                  <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <span class="badge ${isIn ? 'badge-success' : 'badge-danger'}">${escapeHTML(t.kategori)}</span>
                    <span style="font-size:11.5px; color:var(--text-muted);">${formatDateID(t.tanggal)}</span>
                  </div>
                  <div style="font-weight:700; font-size:13.5px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                    ${escapeHTML(actor)}
                  </div>
                  <div style="font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                    ${escapeHTML(t.keterangan)}
                  </div>
                </div>
                <div style="text-align:right; flex-shrink:0;">
                  <div class="tabular-nums" style="font-weight:800; font-size:14px; color:${isIn ? 'var(--success)' : 'var(--danger)'};">
                    ${isIn ? '+' : '-'} ${formatRupiah(t.nominal)}
                  </div>
                  ${isIn
                    ? `<button class="btn btn-xs btn-outline" style="margin-top:4px;" onclick="openReceiptModal('${t.trx_id}')">Kwitansi</button>`
                    : (t.bukti_url ? `<a href="${escapeHTML(t.bukti_url)}" target="_blank" rel="noopener" class="btn btn-xs btn-outline" style="margin-top:4px;">Bukti</a>` : "")
                  }
                </div>
              </div>
            `;
          }).join("");

      return `
        <section class="hero-banner">
          <div class="hero-grid">
            <div>
              <div class="hero-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                SALDO KAS DANA SOSIAL TERKINI
              </div>
              <div class="hero-amount tabular-nums">${formatRupiah(stats.saldoKas)}</div>
              <div class="hero-meta">
                <span>Total Pemasukan: <strong class="tabular-nums">${formatRupiah(stats.totalInAll)}</strong></span>
                <span>•</span>
                <span>Total Penyaluran: <strong class="tabular-nums">${formatRupiah(stats.totalOutAll)}</strong></span>
              </div>
            </div>
            <div class="hero-actions">
              ${heroQuickBtns}
            </div>
          </div>
        </section>

        <section class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-top">
              <span class="kpi-title">Pemasukan (${formatPeriodeID(stats.curYM)})</span>
              <div class="kpi-icon" style="background:var(--success-soft); color:var(--success);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
              </div>
            </div>
            <div class="kpi-value tabular-nums" style="color:var(--success);">${formatRupiah(stats.inThisMonth)}</div>
            <div class="kpi-foot">Iuran rutin & donasi bulan ini</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-top">
              <span class="kpi-title">Penyaluran (${formatPeriodeID(stats.curYM)})</span>
              <div class="kpi-icon" style="background:var(--danger-soft); color:var(--danger);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
              </div>
            </div>
            <div class="kpi-value tabular-nums" style="color:var(--danger);">${formatRupiah(stats.outThisMonth)}</div>
            <div class="kpi-foot">Santunan & bantuan sosial</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-top">
              <span class="kpi-title">Kepatuhan Iuran</span>
              <div class="kpi-icon" style="background:var(--primary-soft); color:var(--primary);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              </div>
            </div>
            <div class="kpi-value tabular-nums">${stats.compliancePct}%</div>
            <div class="kpi-foot">${stats.paidMembersCount} dari ${stats.activeCount} anggota lunas</div>
          </div>

          <div class="kpi-card">
            <div class="kpi-top">
              <span class="kpi-title">Anggota Aktif</span>
              <div class="kpi-icon" style="background:var(--secondary-soft); color:var(--secondary);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </div>
            </div>
            <div class="kpi-value tabular-nums">${stats.activeCount} Orang</div>
            <div class="kpi-foot">Iuran standar ${formatRupiah(state.settings.nominal_default)}/bln</div>
          </div>
        </section>

        <section class="dash-grid">
          <div class="card">
            <div class="card-header">
              <div>
                <h3 class="card-title">Arus Kas Bulanan (${state.selectedYear})</h3>
                <p class="card-subtitle">Perbandingan pemasukan iuran vs penyaluran dana sosial</p>
              </div>
              <div style="display:flex; gap:12px; font-size:12px; font-weight:700; align-items:center;">
                <span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:10px;height:10px;border-radius:3px;background:#0f766e;"></span>Masuk</span>
                <span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:10px;height:10px;border-radius:3px;background:#e11d48;"></span>Keluar</span>
                <span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:12px;height:2.5px;border-radius:2px;background:#0d9488;"></span>Tren</span>
              </div>
            </div>
            <div class="card-body">
              <div class="chart-live-bar" id="chart-live-inspector">
                <span><strong>${formatPeriodeID(activePoint.ym)}</strong> <span style="color:var(--text-light);">• Ketuk/arahkan ke bulan</span></span>
                <div style="display:flex; gap:12px; flex-wrap:wrap;" class="tabular-nums">
                  <span style="color:var(--success); font-weight:700;">Masuk: ${formatRupiah(activePoint.masuk)}</span>
                  <span style="color:var(--danger); font-weight:700;">Keluar: ${formatRupiah(activePoint.keluar)}</span>
                  <span style="color:var(--primary); font-weight:800;">Net: ${activeNet >= 0 ? '+' : ''}${formatRupiah(activeNet)}</span>
                </div>
              </div>
              <div class="chart-box">
                <svg width="${svgW}" height="${chartH}" viewBox="0 0 ${svgW} ${chartH}" style="display:block; margin:0 auto;">
                  <defs>
                    <linearGradient id="gradMasuk" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#14b8a6" />
                      <stop offset="100%" stop-color="#0f766e" />
                    </linearGradient>
                    <linearGradient id="gradKeluar" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#fb7185" />
                      <stop offset="100%" stop-color="#e11d48" />
                    </linearGradient>
                    <linearGradient id="gradTrendArea" x1="0" y1="0" x2="0" y2="1">

                <span><strong>Rekening Kas:</strong> ${escapeHTML(state.settings.info_rekening)}</span>
