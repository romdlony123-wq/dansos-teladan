    function highlightChartMonth(idx) {
      const series = window._chartSeriesCache || [];
      const item = series[idx];
      if (!item) return;

      document.querySelectorAll(".chart-col-group").forEach(el => {
        el.classList.toggle("active-col", Number(el.dataset.idx) === idx);
      });

      const inspector = document.getElementById("chart-live-inspector");
      if (inspector) {
        const net = item.masuk - item.keluar;
        inspector.innerHTML = `
          <span><strong>${escapeHTML(formatPeriodeID(item.ym))}</strong> <span style="color:var(--text-light);">• Ketuk/arahkan ke bulan</span></span>
          <div style="display:flex; gap:12px; flex-wrap:wrap;" class="tabular-nums">
            <span style="color:var(--success); font-weight:700;">Masuk: ${formatRupiah(item.masuk)}</span>
            <span style="color:var(--danger); font-weight:700;">Keluar: ${formatRupiah(item.keluar)}</span>
            <span style="color:var(--primary); font-weight:800;">Net: ${net >= 0 ? "+" : ""}${formatRupiah(net)}</span>
          </div>
        `;
      }
    }

    // ==========================================
    // 2. MANAJEMEN ANGGOTA & MATRIKS IURAN
    // ==========================================
    function renderMembersView() {
      const curYM = getCurrentYM();
      const units = ["ALL", ...new Set(state.members.map(m => m.unit_kelompok).filter(Boolean))];

      const filteredMembers = state.members.filter(m => {
        if (m.status !== "Aktif") return false;
        const matchSearch =
          m.nama.toLowerCase().includes(state.memberSearch.toLowerCase()) ||
          String(m.kode_anggota).toLowerCase().includes(state.memberSearch.toLowerCase());
        const matchUnit = state.memberUnitFilter === "ALL" || m.unit_kelompok === state.memberUnitFilter;
        const paidNow = hasPaidMonth(m.member_id, curYM);
        const matchStatus =
          state.memberStatusFilter === "ALL" ||
          (state.memberStatusFilter === "PAID" && paidNow) ||
          (state.memberStatusFilter === "UNPAID" && !paidNow);
        return matchSearch && matchUnit && matchStatus;
      });

      const currentMonthNum = parseInt(curYM.split("-")[1], 10);

      const adminHeaderTools = isAdmin()
        ? `<div style="display:flex; gap:8px; flex-wrap:wrap;">
             <button class="btn btn-wa btn-sm" onclick="openReminderListModal()">
               <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
               Rekap Reminder WA
             </button>
             <button class="btn btn-primary btn-sm" onclick="openIuranModal()">+ Catat Iuran</button>
           </div>`
        : "";

      let contentHTML = "";
      if (state.memberViewMode === "matrix") {
        const rows = filteredMembers.map((m, idx) => {
          let paidCountYear = 0;
          const cells = MONTHS_ID.map((mo, mIdx) => {
            const ym = `${state.selectedYear}-${mo.num}`;
            const trx = getTransactionForMonth(m.member_id, ym);
            if (trx) paidCountYear++;
            const isOverdue = !trx && (mIdx + 1) <= currentMonthNum && state.selectedYear === String(state.settings.tahun_aktif);
            const cls = trx ? "paid" : isOverdue ? "overdue" : "unpaid";
            const symbol = trx ? "✓" : isOverdue ? "!" : "·";
            const onClickAction = trx
              ? `openReceiptModal('${trx.trx_id}')`
              : isAdmin()
                ? `openIuranModal('${m.member_id}', '${ym}')`
                : `openMemberDetailModal('${m.member_id}')`;

            return `<td style="text-align:center; padding:8px 4px;">
              <button class="matrix-cell ${cls}" onclick="${onClickAction}" title="${mo.name} ${state.selectedYear}: ${trx ? 'Lunas (Klik untuk kwitansi)' : 'Belum bayar'}">${symbol}</button>
            </td>`;
          }).join("");

          return `
            <tr>
              <td class="tabular-nums" style="color:var(--text-muted);">${idx + 1}</td>
              <td>
                <div style="font-weight:700; color:var(--text-main); cursor:pointer;" onclick="openMemberDetailModal('${m.member_id}')">${escapeHTML(m.nama)}</div>
                <div style="font-size:11.5px; color:var(--text-muted);">${escapeHTML(m.unit_kelompok)} • ${formatRupiah(m.nominal_iuran)}/bln</div>
              </td>
              ${cells}
              <td class="tabular-nums" style="text-align:right; font-weight:700; color:var(--primary);">
                ${paidCountYear}/12 Bln
              </td>
              <td style="text-align:right;">
                <button class="btn btn-xs btn-outline" onclick="openMemberDetailModal('${m.member_id}')">Detail</button>
              </td>
            </tr>
          `;
        }).join("");

        contentHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:40px;">No</th>
                  <th>Nama Anggota</th>
                  ${MONTHS_ID.map(m => `<th style="text-align:center; padding:10px 4px;">${m.short}</th>`).join("")}
                  <th style="text-align:right;">Capaian</th>
                  <th style="text-align:right;">Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${rows || `<tr><td colspan="16" style="text-align:center; padding:24px; color:var(--text-muted);">Tidak ada anggota yang sesuai filter.</td></tr>`}
              </tbody>
            </table>
          </div>
          <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:var(--text-muted);">
            <span><strong style="color:var(--success);">✓ Hijau:</strong> Lunas (Klik untuk lihat kwitansi)</span>
            <span><strong style="color:var(--warning);">! Kuning:</strong> Belum bayar s.d. bulan berjalan</span>
            <span><strong>· Abu:</strong> Periode mendatang</span>
          </div>
        `;
      } else {
        // Mobile-First Card View
        const cards = filteredMembers.map(m => {
          const paidNow = hasPaidMonth(m.member_id, curYM);
          const miniTags = MONTHS_ID.map((mo, mIdx) => {
            const ym = `${state.selectedYear}-${mo.num}`;
            const trx = getTransactionForMonth(m.member_id, ym);
            const isOverdue = !trx && (mIdx + 1) <= currentMonthNum && state.selectedYear === String(state.settings.tahun_aktif);
            const bg = trx ? "var(--success-soft); color:var(--success);" : isOverdue ? "var(--warning-soft); color:var(--warning);" : "#f1f5f9; color:#94a3b8;";
            return `<div class="mini-m-tag" style="background:${bg}">${mo.short}</div>`;
          }).join("");

          return `
            <div class="item-card">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                <div>
                  <div style="font-weight:800; font-size:14.5px;">${escapeHTML(m.nama)}</div>
                  <div style="font-size:12px; color:var(--text-muted);">${escapeHTML(m.unit_kelompok)} • Iuran ${formatRupiah(m.nominal_iuran)}</div>
                </div>
                <span class="badge ${paidNow ? 'badge-success' : 'badge-warning'}">
                  ${paidNow ? 'Lunas Bln Ini' : 'Belum Bayar'}
                </span>
              </div>
              <div class="mini-months">${miniTags}</div>
              <div style="display:flex; justify-content:space-between; align-items:center; padding-top:8px; border-top:1px solid var(--border); gap:8px;">
                <button class="btn btn-xs btn-outline" onclick="openMemberDetailModal('${m.member_id}')">Riwayat & Rincian</button>
                ${isAdmin()
                  ? `<div style="display:flex; gap:6px;">
                       ${!paidNow ? `<button class="btn btn-xs btn-wa" onclick="sendWhatsAppReminder('${m.member_id}')">WA</button>` : ""}
                       <button class="btn btn-xs btn-primary" onclick="openIuranModal('${m.member_id}', '${curYM}')">+ Bayar</button>
                     </div>`
                  : ""
                }
              </div>
            </div>
          `;
        }).join("");

        contentHTML = `<div class="mobile-cards-grid">${cards || `<p style="color:var(--text-muted);">Tidak ada data anggota.</p>`}</div>`;
      }

      return `
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Status Iuran Anggota (${state.selectedYear})</h3>
              <p class="card-subtitle">Menampilkan ${filteredMembers.length} anggota aktif</p>
            </div>
            ${adminHeaderTools}
          </div>
          <div class="card-body">
            <div class="filter-bar">
              <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="input-control" placeholder="Cari nama atau NIP..." value="${escapeHTML(state.memberSearch)}" oninput="state.memberSearch=this.value; renderCurrentPage();" />
              </div>

              <select class="select-control" onchange="state.selectedYear=this.value; renderCurrentPage();">
                <option value="2025" ${state.selectedYear === "2025" ? "selected" : ""}>Tahun 2025</option>
                <option value="2026" ${state.selectedYear === "2026" ? "selected" : ""}>Tahun 2026</option>
                <option value="2027" ${state.selectedYear === "2027" ? "selected" : ""}>Tahun 2027</option>
              </select>

              <select class="select-control" onchange="state.memberUnitFilter=this.value; renderCurrentPage();">
                ${units.map(u => `<option value="${escapeHTML(u)}" ${state.memberUnitFilter === u ? "selected" : ""}>${u === "ALL" ? "Semua Unit" : escapeHTML(u)}</option>`).join("")}
              </select>

              <select class="select-control" onchange="state.memberStatusFilter=this.value; renderCurrentPage();">
                <option value="ALL" ${state.memberStatusFilter === "ALL" ? "selected" : ""}>Semua Status</option>
                <option value="PAID" ${state.memberStatusFilter === "PAID" ? "selected" : ""}>Lunas Bulan Ini</option>
                <option value="UNPAID" ${state.memberStatusFilter === "UNPAID" ? "selected" : ""}>Belum Bayar Bulan Ini</option>
              </select>

              <div style="display:flex; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden;">
                <button class="btn btn-xs ${state.memberViewMode === 'cards' ? 'btn-primary' : 'btn-outline'}" style="border:none; border-radius:0;" onclick="state.memberViewMode='cards'; renderCurrentPage();">Kartu</button>
                <button class="btn btn-xs ${state.memberViewMode === 'matrix' ? 'btn-primary' : 'btn-outline'}" style="border:none; border-radius:0;" onclick="state.memberViewMode='matrix'; renderCurrentPage();">Matriks 12 Bln</button>
              </div>
            </div>

            ${contentHTML}
          </div>
        </div>
      `;
    }

    function openMemberDetailModal(memberId) {
      const m = state.members.find(x => x.member_id === memberId);
      if (!m) return;
      const curYM = getCurrentYM();
      const curMo = parseInt(curYM.split("-")[1], 10);

      const unpaidMonths = [];
      const gridItems = MONTHS_ID.map((mo, idx) => {
        const ym = `${state.selectedYear}-${mo.num}`;
        const trx = getTransactionForMonth(m.member_id, ym);
        if (!trx && (idx + 1) <= curMo && state.selectedYear === String(state.settings.tahun_aktif)) {
          unpaidMonths.push(mo.name);
        }
        return `
          <div style="padding:8px; border-radius:8px; border:1px solid ${trx ? '#a7f3d0' : 'var(--border)'}; background:${trx ? 'var(--success-soft)' : '#f8fafc'}; text-align:center;">
            <div style="font-size:11.5px; font-weight:700;">${mo.short}</div>
            <div style="font-size:11px; color:${trx ? 'var(--success)' : 'var(--text-muted)'}; margin-top:2px;">
              ${trx ? "Lunas" : "Belum"}
            </div>
          </div>
        `;
      }).join("");

      const memberTrxs = state.transactions
        .filter(t => t.member_id === m.member_id)
        .sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)));

      const footer = isAdmin()
        ? `<button class="btn btn-outline" onclick="closeModal()">Tutup</button>
           ${unpaidMonths.length > 0 ? `<button class="btn btn-wa" onclick="sendWhatsAppReminder('${m.member_id}')">Kirim Reminder WA (${unpaidMonths.length} Bln)</button>` : ""}
           <button class="btn btn-primary" onclick="openIuranModal('${m.member_id}')">+ Catat Iuran</button>`
        : `<button class="btn btn-primary" onclick="closeModal()">Tutup</button>`;

      openModal(
        `Rincian Iuran Anggota`,
        `
          <div style="background:var(--bg-app); padding:14px; border-radius:12px; border:1px solid var(--border);">
            <div style="font-weight:800; font-size:16px;">${escapeHTML(m.nama)}</div>
            <div style="font-size:12.5px; color:var(--text-muted); margin-top:2px;">
              NIP/Kode: <span class="mono">${escapeHTML(m.kode_anggota || "-")}</span> • Unit: ${escapeHTML(m.unit_kelompok)}
            </div>
            <div style="font-size:12.5px; color:var(--text-muted); margin-top:2px;">
              No. WA: <span class="mono">${escapeHTML(maskPhone(m.no_wa))}</span> • Iuran Wajib: <strong>${formatRupiah(m.nominal_iuran)}/bln</strong>
            </div>
          </div>

          <div>
            <div style="font-size:12.5px; font-weight:700; margin-bottom:8px;">Status Pembayaran Tahun ${state.selectedYear}</div>
            <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;">
              ${gridItems}
            </div>
          </div>

          <div>
            <div style="font-size:12.5px; font-weight:700; margin-bottom:6px;">Riwayat Transaksi Terkait (${memberTrxs.length})</div>
            <div style="max-height:160px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:0 10px;">
              ${memberTrxs.length === 0
                ? `<p style="font-size:12.5px; color:var(--text-muted); padding:12px 0;">Belum ada riwayat transaksi.</p>`
                : memberTrxs.map(t => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px;">
                      <div>
                        <strong>${escapeHTML(t.kategori)}</strong> (${formatPeriodeID(t.periode_bulan)})
                        <div style="font-size:11px; color:var(--text-muted);">${formatDateID(t.tanggal)}</div>
                      </div>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <strong class="tabular-nums">${formatRupiah(t.nominal)}</strong>
                        ${t.jenis === "Masuk" ? `<button class="btn btn-xs btn-outline" onclick="openReceiptModal('${t.trx_id}')">Kwitansi</button>` : ""}
                      </div>
                    </div>
                  `).join("")
              }
            </div>
          </div>
        `,
        footer
      );
    }

    // ==========================================
    // 3. TRANSAKSI & PEMBAYARAN
    // ==========================================
    function renderTransactionsView() {
      const allCats = ["ALL", ...TRX_CATEGORIES.Masuk, ...TRX_CATEGORIES.Keluar];
      const filtered = state.transactions
        .filter(t => {
          const q = state.trxSearch.toLowerCase();
          const mName = getMemberName(t.member_id).toLowerCase();
          const matchQ =
            t.keterangan.toLowerCase().includes(q) ||
            t.trx_id.toLowerCase().includes(q) ||
            mName.includes(q);
          const matchType = state.trxTypeFilter === "ALL" || t.jenis === state.trxTypeFilter;
          const matchCat = state.trxCatFilter === "ALL" || t.kategori === state.trxCatFilter;
          const matchMonth = state.trxMonthFilter === "ALL" || String(t.tanggal).startsWith(`${state.selectedYear}-${state.trxMonthFilter}`);
          return matchQ && matchType && matchCat && matchMonth;
        })
        .sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)));

      const sumIn = filtered.filter(t => t.jenis === "Masuk").reduce((a, b) => a + (Number(b.nominal) || 0), 0);
      const sumOut = filtered.filter(t => t.jenis === "Keluar").reduce((a, b) => a + (Number(b.nominal) || 0), 0);

      const adminActionBtns = isAdmin()
        ? `<div style="display:flex; gap:8px; flex-wrap:wrap;">
             <button class="btn btn-primary btn-sm" onclick="openIuranModal()">+ Catat Iuran</button>
             <button class="btn btn-outline btn-sm" onclick="openTransactionModal('Masuk')">+ Pemasukan Lain</button>
             <button class="btn btn-danger btn-sm" onclick="openTransactionModal('Keluar')">+ Catat Pengeluaran</button>

                <span class="badge ${isIn ? 'badge-success' : 'badge-danger'}">${escapeHTML(t.kategori)}</span>
                <span class="mono" style="font-size:11px; color:var(--text-muted);">${escapeHTML(t.trx_id)}</span>

              <div>
                <div style="font-weight:800; font-size:14.5px;">${escapeHTML(subject)}</div>

              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; padding-top:8px; border-top:1px solid var(--border);">
                <div>
                  <div style="font-size:11px; color:var(--text-muted);">${formatDateID(t.tanggal)} • Periode ${formatPeriodeID(t.periode_bulan)}</div>
                  <div class="tabular-nums" style="font-weight:800; font-size:15px; color:${isIn ? 'var(--success)' : 'var(--danger)'};">

                  </div>
                </div>
                <div style="display:flex; gap:6px;">
                  ${isIn ? `<button class="btn btn-xs btn-soft-primary" onclick="openReceiptModal('${t.trx_id}')">Kwitansi</button>` : ""}

                ${t.member_id ? `<div style="font-weight:700;">${escapeHTML(subject)}</div>` : ""}

              </td>
              <td style="white-space:nowrap;">${formatPeriodeID(t.periode_bulan)}</td>
              <td class="tabular-nums" style="text-align:right; font-weight:800; color:${isIn ? 'var(--success)' : 'var(--danger)'}; white-space:nowrap;">
                ${isIn ? '+' : '-'} ${formatRupiah(t.nominal)}
              </td>
              <td style="text-align:right; white-space:nowrap;">

                  <button class="btn btn-xs btn-outline" onclick="openEditTransactionModal('${t.trx_id}')">Edit</button>
                  <button class="btn btn-xs btn-soft-danger" onclick="confirmDeleteTransaction('${t.trx_id}')">Hapus</button>
                ` : ""}
              </td>
            </tr>
          `;

        listHTML = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID Transaksi</th>
                  <th>Tanggal</th>

    // Modal Catat Iuran Multi-Bulan
    function openIuranModal(preMemberId = "", preYM = "") {
      if (!isAdmin()) return openLoginModal();
      const activeMembers = state.members.filter(m => m.status === "Aktif");
      const defaultMember = activeMembers.find(m => m.member_id === preMemberId) || activeMembers[0];
      const todayStr = new Date().toISOString().slice(0, 10);

      openModal(
        "Catat Pembayaran Iuran Anggota",
        `
          <form id="iuran-form" onsubmit="submitIuranForm(event)" style="display:flex; flex-direction:column; gap:14px;">
            <div class="form-group">
              <label>Pilih Anggota</label>
              <select id="iuran-member" class="select-control" required onchange="refreshIuranMonthCheckboxes('${preYM}')">
                ${activeMembers.map(m => `<option value="${m.member_id}" ${defaultMember && m.member_id === defaultMember.member_id ? "selected" : ""}>${escapeHTML(m.nama)} (${escapeHTML(m.unit_kelompok)} — ${formatRupiah(m.nominal_iuran)})</option>`).join("")}
              </select>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Tanggal Setor</label>
                <input type="date" id="iuran-date" class="input-control" value="${todayStr}" required />
              </div>
              <div class="form-group">
                <label>Nominal per Bulan (Rp)</label>
                <input type="number" id="iuran-nominal" class="input-control" value="${defaultMember ? defaultMember.nominal_iuran : state.settings.nominal_default}" min="1000" step="500" required oninput="updateIuranTotalPreview()" />
              </div>
            </div>

            <div class="form-group">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <label>Pilih Bulan Pembayaran (${state.selectedYear})</label>
                <button type="button" class="btn btn-xs btn-soft-primary" onclick="selectUnpaidUpToNow()">Pilih Tunggakan s.d. Bln Ini</button>
              </div>
              <div class="month-picker-grid" id="iuran-month-grid"></div>
              <div id="iuran-total-preview" style="font-size:12.5px; font-weight:700; color:var(--primary); margin-top:4px;">Total Bayar: Rp 0 (0 bulan)</div>
            </div>

            <div class="form-group">
              <label>Catatan / Keterangan (Opsional)</label>
              <input type="text" id="iuran-note" class="input-control" placeholder="Contoh: Transfer BSI / Tunai ke bendahara" />
            </div>

            <div class="form-group">
              <label>Link Foto Bukti Transfer (Opsional)</label>
              <input type="url" id="iuran-bukti" class="input-control" placeholder="https://drive.google.com/..." />
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">Simpan Pembayaran Iuran</button>
          </form>
        `
      );

      refreshIuranMonthCheckboxes(preYM);
    }

    function refreshIuranMonthCheckboxes(preSelectYM = "") {
      const memberId = document.getElementById("iuran-member")?.value;
      const member = state.members.find(m => m.member_id === memberId);
      if (member && document.getElementById("iuran-nominal")) {
        document.getElementById("iuran-nominal").value = member.nominal_iuran;
      }

      const grid = document.getElementById("iuran-month-grid");
      if (!grid) return;

      grid.innerHTML = MONTHS_ID.map(mo => {
        const ym = `${state.selectedYear}-${mo.num}`;
        const paid = hasPaidMonth(memberId, ym);
        const shouldCheck = !paid && (preSelectYM === ym || (!preSelectYM && ym === getCurrentYM()));
        return `
          <label class="month-check-item ${paid ? 'already-paid' : shouldCheck ? 'selected' : ''}" data-ym="${ym}">
            <input type="checkbox" value="${ym}" ${paid ? "disabled" : ""} ${shouldCheck ? "checked" : ""} style="display:none;" onchange="toggleMonthCheckbox(this)" />
            <span>${mo.short} ${paid ? "✓" : ""}</span>
          </label>
        `;
      }).join("");

      updateIuranTotalPreview();
    }

    function toggleMonthCheckbox(cb) {
      cb.parentElement.classList.toggle("selected", cb.checked);
      updateIuranTotalPreview();
    }

    function selectUnpaidUpToNow() {
      const curMo = parseInt(getCurrentYM().split("-")[1], 10);
      document.querySelectorAll("#iuran-month-grid input[type='checkbox']:not(:disabled)").forEach((cb, idx) => {
        const moNum = parseInt(cb.value.split("-")[1], 10);
        cb.checked = moNum <= curMo;
        cb.parentElement.classList.toggle("selected", cb.checked);
      });
      updateIuranTotalPreview();
    }

    function updateIuranTotalPreview() {
      const checked = Array.from(document.querySelectorAll("#iuran-month-grid input[type='checkbox']:checked"));
      const perMonth = Number(document.getElementById("iuran-nominal")?.value) || 0;
      const total = checked.length * perMonth;
      const el = document.getElementById("iuran-total-preview");
      if (el) {
        el.textContent = `Total Bayar: ${formatRupiah(total)} (${checked.length} bulan dipilih)`;
      }
    }

    async function submitIuranForm(e) {
      e.preventDefault();
      const member_id = document.getElementById("iuran-member").value;
      const tanggal = document.getElementById("iuran-date").value;
      const nominal_per_bulan = Number(document.getElementById("iuran-nominal").value);
      const periode_list = Array.from(document.querySelectorAll("#iuran-month-grid input[type='checkbox']:checked")).map(cb => cb.value);
      const keterangan = document.getElementById("iuran-note").value.trim();
      const bukti_url = document.getElementById("iuran-bukti").value.trim();

      if (periode_list.length === 0) {
        showToast("Pilih minimal 1 bulan pembayaran.", "error");
        return;
      }

      setLoading(true, "Menyimpan pembayaran iuran...");
      try {
        const res = await apiRequest("saveTransaction", {
          jenis: "Masuk",
          kategori: "Iuran Rutin",
          member_id,
          tanggal,
          periode_list,
          nominal_per_bulan,
          nominal: nominal_per_bulan * periode_list.length,
          keterangan,
          bukti_url
        }, "POST");
        closeModal();
        showToast(res.message, "success");
        await refreshData();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

            <button type="submit" class="btn btn-primary" style="width:100%;">Simpan Transaksi</button>

    function openEditTransactionModal(trxId) {
      const trx = state.transactions.find(t => t.trx_id === trxId);
      if (trx) openTransactionModal(trx.jenis, trx);

    function updateTrxCategories() {
      const jenis = document.getElementById("trx-jenis").value;

      document.getElementById("trx-kategori").innerHTML = cats.map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join("");

    async function submitTransactionForm(e, trxId = "") {

      const jenis = document.getElementById("trx-jenis").value;
      const kategori = document.getElementById("trx-kategori").value;
      const tanggal = document.getElementById("trx-tanggal").value;
      const nominal = Number(document.getElementById("trx-nominal").value);
      const member_id = document.getElementById("trx-member").value;
      const keterangan = document.getElementById("trx-keterangan").value.trim();
      const bukti_url = document.getElementById("trx-bukti").value.trim();

      setLoading(true, "Menyimpan transaksi...");

        const res = await apiRequest("saveTransaction", {
          trx_id: trxId || undefined,
          jenis,
          kategori,
          tanggal,
          periode_bulan: tanggal.slice(0, 7),
          nominal,
          member_id,
          keterangan,
          bukti_url
        }, "POST");

        await refreshData();

        showToast(err.message, "error");

    function confirmDeleteTransaction(trxId) {
      openModal(
        "Hapus Transaksi",

         <button class="btn btn-danger" onclick="deleteTransaction('${trxId}')">Ya, Hapus</button>`
      );

    async function deleteTransaction(trxId) {
      setLoading(true, "Menghapus transaksi...");
      try {
        const res = await apiRequest("deleteTransaction", { trx_id: trxId }, "POST");
        closeModal();
        showToast(res.message, "success");
        await refreshData();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

    // ==========================================
    // 4. LAPORAN & TRANSPARANSI KEUANGAN
    // ==========================================
    function renderReportsView() {
      const targetPrefix = state.reportMode === "monthly"
        ? `${state.reportYear}-${state.reportMonth}`
        : `${state.reportYear}`;

      const periodLabel = state.reportMode === "monthly"
        ? `${formatPeriodeID(targetPrefix)}`
        : `Tahun Buku ${state.reportYear}`;

      const periodTrxs = state.transactions
        .filter(t => String(t.tanggal).startsWith(targetPrefix))
        .sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));

      // Saldo sebelum periode
      const prevTrxs = state.transactions.filter(t => String(t.tanggal).slice(0, targetPrefix.length) < targetPrefix);
      const saldoAwal = prevTrxs.reduce((acc, t) => acc + (t.jenis === "Masuk" ? Number(t.nominal) : -Number(t.nominal)), 0);

      const totalMasuk = periodTrxs.filter(t => t.jenis === "Masuk").reduce((a, b) => a + Number(b.nominal), 0);
      const totalKeluar = periodTrxs.filter(t => t.jenis === "Keluar").reduce((a, b) => a + Number(b.nominal), 0);
      const saldoAkhir = saldoAwal + totalMasuk - totalKeluar;

      // Rekap per kategori
      const groupByCat = (jenis) => {
        const map = {};
        periodTrxs.filter(t => t.jenis === jenis).forEach(t => {
          map[t.kategori] = (map[t.kategori] || 0) + Number(t.nominal);
        });
        return Object.entries(map);
      };

      const masukCats = groupByCat("Masuk");
      const keluarCats = groupByCat("Keluar");

      return `
        <!-- Header Khusus Cetak PDF -->
        <div class="print-only" style="text-align:center; border-bottom:2px solid #0f172a; padding-bottom:14px; margin-bottom:20px;">
          <h2 style="font-size:18px; text-transform:uppercase;">LAPORAN PERTANGGUNGJAWABAN KEUANGAN DANA SOSIAL</h2>
          <h3 style="font-size:16px; margin-top:2px;">${escapeHTML(state.settings.nama_sekolah)}</h3>
          <p style="font-size:13px; color:#475569; margin-top:4px;">Periode Laporan: <strong>${escapeHTML(periodLabel)}</strong></p>
        </div>

        <div class="card no-print" style="margin-bottom:18px;">
          <div class="card-header">
            <div>
              <h3 class="card-title">Filter & Ekspor Laporan Resmi</h3>
              <p class="card-subtitle">Transparansi pertanggungjawaban kas untuk warga sekolah</p>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn btn-outline btn-sm" onclick="exportReportCSV()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Unduh CSV / Excel
              </button>
              <button class="btn btn-primary btn-sm" onclick="window.print()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Cetak / Simpan PDF
              </button>
            </div>
          </div>
          <div class="card-body">
            <div class="filter-bar" style="margin-bottom:0;">
              <select class="select-control" onchange="state.reportMode=this.value; renderCurrentPage();">
                <option value="monthly" ${state.reportMode === "monthly" ? "selected" : ""}>Laporan Bulanan</option>
                <option value="yearly" ${state.reportMode === "yearly" ? "selected" : ""}>Laporan Tahunan</option>
              </select>

              ${state.reportMode === "monthly" ? `
                <select class="select-control" onchange="state.reportMonth=this.value; renderCurrentPage();">
                  ${MONTHS_ID.map(m => `<option value="${m.num}" ${state.reportMonth === m.num ? "selected" : ""}>${m.name}</option>`).join("")}
                </select>
              ` : ""}

              <select class="select-control" onchange="state.reportYear=this.value; renderCurrentPage();">
                <option value="2025" ${state.reportYear === "2025" ? "selected" : ""}>2025</option>
                <option value="2026" ${state.reportYear === "2026" ? "selected" : ""}>2026</option>
                <option value="2027" ${state.reportYear === "2027" ? "selected" : ""}>2027</option>
              </select>
            </div>
          </div>
        </div>

        <section class="kpi-grid">
          <div class="kpi-card">
            <span class="kpi-title">Saldo Awal (${periodLabel})</span>
            <div class="kpi-value tabular-nums">${formatRupiah(saldoAwal)}</div>
            <div class="kpi-foot">Akumulasi sebelum periode</div>
          </div>
          <div class="kpi-card">
            <span class="kpi-title">Total Kas Masuk</span>
            <div class="kpi-value tabular-nums" style="color:var(--success);">+ ${formatRupiah(totalMasuk)}</div>
            <div class="kpi-foot">${periodTrxs.filter(t => t.jenis === "Masuk").length} transaksi masuk</div>
          </div>
          <div class="kpi-card">
            <span class="kpi-title">Total Penyaluran</span>
            <div class="kpi-value tabular-nums" style="color:var(--danger);">- ${formatRupiah(totalKeluar)}</div>
            <div class="kpi-foot">${periodTrxs.filter(t => t.jenis === "Keluar").length} penyaluran keluar</div>
          </div>
          <div class="kpi-card" style="background:var(--primary-soft); border-color:var(--primary-light);">
            <span class="kpi-title" style="color:var(--primary);">Saldo Akhir Kas</span>
            <div class="kpi-value tabular-nums" style="color:var(--primary);">${formatRupiah(saldoAkhir)}</div>

              ${masukCats.length === 0

                    <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
                      <span>${escapeHTML(cat)}</span>
                      <strong class="tabular-nums" style="color:var(--success);">${formatRupiah(val)}</strong>
                    </div>
                  `).join("")
              }
            </div>
          </div>

          <div class="card">
            <div class="card-header"><h3 class="card-title">Rincian Penyaluran Dana Sosial</h3></div>
            <div class="card-body">
              ${keluarCats.length === 0
                ? `<p style="font-size:13px; color:var(--text-muted);">Tidak ada penyaluran dana pada periode ini.</p>`
                : keluarCats.map(([cat, val]) => `
                    <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
                      <span>${escapeHTML(cat)}</span>
                      <strong class="tabular-nums" style="color:var(--danger);">${formatRupiah(val)}</strong>
                    </div>
                  `).join("")
              }
            </div>
          </div>
        </section>

            <h3 class="card-title">Jurnal Rincian Transaksi — ${escapeHTML(periodLabel)}</h3>
          </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Tanggal</th>
                    <th>Kategori</th>
                    <th>Keterangan / Anggota</th>
                    <th style="text-align:right;">Masuk</th>
                    <th style="text-align:right;">Keluar</th>
                  </tr>
                </thead>

                    ? `<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--text-muted);">Belum ada transaksi pada periode ini.</td></tr>`
                    : periodTrxs.map(t => `
                        <tr>
                          <td style="white-space:nowrap;">${formatDateID(t.tanggal)}</td>
                          <td>${escapeHTML(t.kategori)}</td>
                          <td>${t.member_id ? `<strong>${escapeHTML(getMemberName(t.member_id))}</strong> — ` : ""}${escapeHTML(t.keterangan)}</td>
                          <td class="tabular-nums" style="text-align:right; color:var(--success);">${t.jenis === "Masuk" ? formatRupiah(t.nominal) : "-"}</td>
                          <td class="tabular-nums" style="text-align:right; color:var(--danger);">${t.jenis === "Keluar" ? formatRupiah(t.nominal) : "-"}</td>
                        </tr>
                      `).join("")
                  }
                </tbody>
              </table>
            </div>

            <!-- Blok Tanda Tangan Resmi untuk Cetak -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:32px; text-align:center; font-size:13px;">
              <div>
                <p>Mengetahui,</p>
                <p>Kepala ${escapeHTML(state.settings.nama_sekolah)}</p>
                <div style="height:64px;"></div>
                <p style="font-weight:800; text-decoration:underline;">${escapeHTML(state.settings.nama_kepsek)}</p>
              </div>
              <div>
                <p>Dibuat oleh,</p>

    function exportReportCSV() {
      const targetPrefix = state.reportMode === "monthly" ? `${state.reportYear}-${state.reportMonth}` : `${state.reportYear}`;
      const rows = state.transactions
        .filter(t => String(t.tanggal).startsWith(targetPrefix))
        .sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));

      if (rows.length === 0) {
        showToast("Tidak ada data transaksi pada periode terpilih untuk diunduh.", "error");
        return;
      }

      const header = ["ID Transaksi", "Tanggal", "Jenis", "Kategori", "Anggota", "Periode", "Nominal", "Keterangan"];
      const csvLines = [header.join(",")];

      rows.forEach(r => {
        const line = [
          r.trx_id,
          r.tanggal,
          r.jenis,
          `"${String(r.kategori).replace(/"/g, '""')}"`,
          `"${String(getMemberName(r.member_id)).replace(/"/g, '""')}"`,
          r.periode_bulan,
          r.nominal,
          `"${String(r.keterangan).replace(/"/g, '""')}"`
        ];
        csvLines.push(line.join(","));
      });

      const blob = new Blob(["\uFEFF" + csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Laporan-Dana-Sosial-${targetPrefix}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("File CSV laporan berhasil diunduh.", "success");
    }

    function getMemberArrears(member) {
      const curYM = getCurrentYM();
      const curMo = parseInt(curYM.split("-")[1], 10);
      const unpaidList = [];
      for (let i = 1; i <= curMo; i++) {
        const mObj = MONTHS_ID[i - 1];
        const ym = `${state.selectedYear}-${mObj.num}`;
        if (!hasPaidMonth(member.member_id, ym)) {
          unpaidList.push(mObj.name);
        }
      }
      return unpaidList;
    }

    function sendWhatsAppReminder(memberId) {
      if (!isAdmin()) return;
      const m = state.members.find(x => x.member_id === memberId);
      if (!m || !m.no_wa) {
        showToast("Nomor WhatsApp anggota belum diisi.", "error");
        return;
      }
      const unpaid = getMemberArrears(m);
      const total = unpaid.length * Number(m.nominal_iuran);
      const text = `Assalamu'alaikum Wr. Wb.\nYth. Bapak/Ibu *${m.nama}*,\n\nIzin mengingatkan terkait Iuran Dana Sosial *${state.settings.nama_sekolah}* Tahun ${state.selectedYear} yang belum tercatat:\n• Bulan: *${unpaid.join(", ")}* (${unpaid.length} bulan)\n• Nominal: *${formatRupiah(total)}*\n\nPembayaran dapat disetorkan melalui Bendahara atau transfer ke ${state.settings.info_rekening}.\nTerima kasih atas perhatian dan partisipasinya.`;

      const cleanPhone = String(m.no_wa).replace(/[^0-9]/g, "");
      window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`, "_blank", "noopener");
    }

        await refreshData();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

    function confirmDeleteUser(userId) {
      openModal(
        "Hapus Akun Admin",
        `<p style="font-size:14px; color:var(--text-muted);">Yakin ingin menghapus akun admin ini?</p>`,
        `<button class="btn btn-outline" onclick="closeModal()">Batal</button>
         <button class="btn btn-danger" onclick="deleteUser('${userId}')">Ya, Hapus</button>`
      );
    }

    async function deleteUser(userId) {
      setLoading(true, "Menghapus akun...");
      try {
        const res = await apiRequest("deleteUser", { user_id: userId }, "POST");
        closeModal();
        showToast(res.message, "success");
        await refreshData();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        setLoading(false);
      }
    }

    // ==========================================
    // BOOTSTRAP APLIKASI
    // ==========================================
    (function initApp() {
      // Deteksi otomatis jika dijalankan di dalam Blogger
      if (window.location.hostname.includes("blogspot.com")) {
        document.body.classList.add("blogger-embed");
      }

      // Pulihkan sesi tersimpan jika ada
      try {
        const saved = localStorage.getItem("dansos_session");
        if (saved) state.session = JSON.parse(saved);
      } catch (_) {}

      if (IS_PREVIEW) {
        initDummyData();
      }

      refreshData();
    })();
  </script>
</body>
</html>
